name: Destroy AWS

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Qual stack destruir"
        type: choice
        options: [cluster, base]
        default: cluster

permissions:
  id-token: write
  contents: read

env:
  STACK: ${{ inputs.stack }}
  AMBIENTE: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}

jobs:
  destroy:
    name: Destroy (${{ inputs.stack }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    defaults:
      run:
        working-directory: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Conferir que bancos e Lambda já foram destruídos
        if: inputs.stack == 'cluster'
        working-directory: ${{ github.workspace }}
        run: |
          RDS=$(aws rds describe-db-instances --query "DBInstances[?DBInstanceIdentifier=='oficina-os-db-${AMBIENTE}' || DBInstanceIdentifier=='oficina-billing-db-${AMBIENTE}' || DBInstanceIdentifier=='oficina-api-db-${AMBIENTE}'].DBInstanceIdentifier" --output text)
          DOCDB=$(aws docdb describe-db-clusters --query "DBClusters[?DBClusterIdentifier=='oficina-execution-docdb-${AMBIENTE}'].DBClusterIdentifier" --output text)
          LAMBDA=$(aws cloudformation describe-stacks --query "Stacks[?StackName=='oficina-auth-lambda-${AMBIENTE}'].StackName" --output text)
          if [ -n "$RDS$DOCDB$LAMBDA" ]; then
            echo "::error::Rode antes o Destroy AWS de oficina-auth-lambda, tech-challenge-1, oficina-billing-service e oficina-execution-service. Ainda de pé: $RDS $DOCDB $LAMBDA"
            exit 1
          fi

      - name: Conferir que o cluster já foi destruído
        if: inputs.stack == 'base'
        working-directory: ${{ github.workspace }}
        run: |
          EKS=$(aws eks list-clusters --query "clusters[?@=='oficina-api-${AMBIENTE}']" --output text)
          if [ -n "$EKS" ]; then
            echo "::error::Destrua o stack cluster antes da base. Ainda de pé: $EKS"
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init -backend-config="key=infra-k8s/${AMBIENTE}/${STACK}/terraform.tfstate"

      - name: Destroy
        env:
          TF_VAR_ambiente: ${{ env.AMBIENTE }}
          TF_VAR_ci_role_principal_arns: ${{ vars.API_DEPLOY_ROLE_ARNS || '[]' }}
          TF_VAR_cluster_admin_principal_arn: ${{ secrets.AWS_CLUSTER_ADMIN_ARN }}
          TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
        run: terraform destroy -auto-approve

      - name: Conferir que nada pago sobrou
        if: inputs.stack == 'cluster'
        working-directory: ${{ github.workspace }}
        run: |
          EKS=$(aws eks list-clusters --query "clusters[?@=='oficina-api-${AMBIENTE}']" --output text)
          NAT=$(aws ec2 describe-instances --filters Name=tag:Name,Values=oficina-api-${AMBIENTE}-nat Name=instance-state-name,Values=pending,running,stopping,stopped --query 'Reservations[].Instances[].InstanceId' --output text)
          NLB=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?LoadBalancerName=='oficina-api-nlb-${AMBIENTE}'].LoadBalancerName" --output text)
          RDS=$(aws rds describe-db-instances --query "DBInstances[?starts_with(DBInstanceIdentifier, 'oficina-') && ends_with(DBInstanceIdentifier, '-${AMBIENTE}')].DBInstanceIdentifier" --output text)
          DOCDB=$(aws docdb describe-db-clusters --query "DBClusters[?starts_with(DBClusterIdentifier, 'oficina-') && ends_with(DBClusterIdentifier, '-${AMBIENTE}')].DBClusterIdentifier" --output text)
          echo "EKS:        $EKS"
          echo "NAT:        $NAT"
          echo "NLB:        $NLB"
          echo "RDS:        $RDS"
          echo "DocumentDB: $DOCDB"
          if [ -n "$EKS$NAT$NLB$RDS$DOCDB" ]; then
            echo "::error::Recursos pagos ainda existem no ambiente ${AMBIENTE}."
            exit 1
          fi
