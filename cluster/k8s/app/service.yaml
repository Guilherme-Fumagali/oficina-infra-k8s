apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
spec:
  # NodePort, não LoadBalancer.
  #
  # O NLB interno é criado pelo Terraform e aponta para este NodePort fixo, com o
  # ASG do node group anexado ao target group. Assim o alvo do VPC Link existe no
  # mesmo apply, sem depender do Kubernetes provisionar um balanceador primeiro
  # (SPEC-02 §1).
  type: NodePort
  selector:
    app: oficina-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
